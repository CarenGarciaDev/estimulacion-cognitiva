<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimulación Cognitiva para Adultos</title>
<style>
:root{--primary:#4f46e5;--primary-dark:#3730a3;--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--success:#15803d;--danger:#b91c1c;--border:#dbe2ea}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1100px;margin:auto;padding:20px}.header,.card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 5px 20px rgba(0,0,0,.06);margin-bottom:18px}
h1{margin:0 0 6px;font-size:28px}h2{margin-top:0}.subtitle{color:var(--muted)}
.progress{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.step{flex:1;min-width:110px;padding:10px;border-radius:10px;background:#e8ebf2;text-align:center;font-weight:700;font-size:13px}.step.active{background:var(--primary);color:white}.step.done{background:#dcfce7;color:var(--success)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{font-weight:700;font-size:14px}input,select{width:100%;padding:12px;margin-top:7px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:white}
button{border:0;border-radius:11px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary-dark)}.secondary{background:#e8ebf2;color:var(--text)}button:disabled{opacity:.65;cursor:not-allowed}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}.instruction{background:#eef2ff;border-left:5px solid var(--primary);padding:14px;border-radius:10px;margin:14px 0 20px}.timer{text-align:center;font-size:28px;font-weight:800;margin:8px 0 18px}.counter{text-align:center;color:var(--muted);margin-bottom:14px}
.item-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;max-width:950px;margin:auto}.item-btn{min-height:56px;background:#fff;border:2px solid #e5e7eb;font-size:24px;color:#111827;border-radius:10px;padding:8px}.item-btn:hover{background:#eef2ff}.item-btn.selected{background:#dbeafe;border-color:var(--primary);color:var(--primary-dark)}
.emoji-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:620px;margin:auto}.emoji-btn{min-height:100px;background:#fff;border:2px solid #e5e7eb;border-radius:14px;font-size:50px}.emoji-btn.selected{background:#dbeafe;border-color:var(--primary)}
.letter-rows{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:14px}.letter-row{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;border:1px solid var(--border);border-radius:12px;padding:10px}.letter-btn{background:#fff;border:2px solid transparent;font-size:30px;min-height:58px}.letter-btn.selected{background:#dbeafe;border-color:var(--primary)}
.result-box{text-align:center;background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:20px}.result-score{font-size:42px;font-weight:800;color:var(--primary)}.hidden{display:none}.small{font-size:13px;color:var(--muted)}.status{display:none;position:fixed;right:20px;bottom:20px;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:20}.status.success{background:#15803d}.status.error{background:#b91c1c}.status.info{background:#334155}
@media(max-width:800px){.grid{grid-template-columns:1fr}.item-grid{grid-template-columns:repeat(8,1fr)}}
@media(max-width:520px){.app{padding:10px}.card{padding:16px}.item-grid{grid-template-columns:repeat(5,1fr)}.emoji-grid{grid-template-columns:repeat(2,1fr)}.letter-row{grid-template-columns:repeat(4,1fr)}.progress{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Estimulación Cognitiva para Adultos</h1>
    <div id="subtitle" class="subtitle">Selecciona la sesión que deseas realizar</div>
    <div id="progress" class="progress"></div>
  </div>

  <section id="screenData" class="card">
    <h2>Datos del participante</h2>
    <p class="subtitle">Los resultados se guardan automáticamente en la hoja correspondiente de Google Sheets.</p>
    <div class="grid">
      <div><label for="participantId">Código del participante *</label><input id="participantId" placeholder="Ej. P001" maxlength="30"></div>
      <div><label for="participantName">Nombre o alias</label><input id="participantName" placeholder="Ej. María" maxlength="80"></div>
      <div><label for="age">Edad</label><input id="age" type="number" min="1" max="120" placeholder="Ej. 68"></div>
      <div><label for="session">Sesión</label><select id="session" onchange="updateSessionPreview()"><option value="2">Sesión 2</option><option value="3" selected>Sesión 3</option></select></div>
    </div>
    <div id="sessionDescription" class="instruction"></div>
    <div class="actions"><button class="primary" onclick="startSession()">Comenzar sesión</button></div>
  </section>

  <section id="screenActivity" class="card hidden">
    <div id="activityContent"></div>
    <div class="actions"><button class="secondary" onclick="resetCurrentActivity()">Reiniciar actividad</button><button id="finishActivityBtn" class="primary" onclick="finishActivity()">Terminar actividad</button></div>
  </section>

  <section id="screenResult" class="card hidden">
    <h2>Sesión finalizada</h2><div id="resultContent"></div>
    <div class="actions"><button id="submitBtn" class="primary" onclick="submitResults()">Enviar resultados</button></div>
    <p id="submitNote" class="small"></p>
  </section>
</div>
<div id="status" class="status"></div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6YgXdxHYeqqFJkwI9XLfXlhgpc0hhFtQZVlR6RuWh9G09o0JOE2qUOL3DdVY95ZNL9g/exec";

const session2Activities = [
 {page:"07",name:"Encuentra todos los números 7",type:"mixed",instruction:"Selecciona únicamente todos los números 7.",data:[6,1,7,5,0,4,9,8,0,7,6,8,9,8,0,4,9,0,3,2,1,7,5,2,8,4,3,5,7,3,7,5,2,8,6,8,5,1,4,5,1,0,2,3,9,9,2,8,1,7,3,4,6,9,2,9,7,4,6,4,3,0,3,9,8,9,2,3,7,6,3,6,0,2,1,8,7,6,2,3,7,6,9,8,3,5,2,1,5,8,1,6,1,0,4,0,1,2,1,9,7,9,8,1,5,0,3,4,7,9,5,8,0,5,4,0,4,7,9,2,5,8,5,6,1,2,3,7,3,1,2,1,6,4,6,2,4,9,4,5,6,0,4,6,0,8,5,3,0,7],isCorrect:v=>v===7},
 {page:"08",name:"Encuentra los símbolos objetivo",type:"mixed",instruction:"Selecciona los rectángulos y rombos.",data:["▭","○","□","▭","△","✚","□","○","▭","◇","✚","⬟","□","★","◇","✚","★","⬟","△","✚","♣","★","○","✚","○","▭","□","♣","★","◇","▭","△","✚","○","♣","□","△","⬟","★","▭","○","✚","★","◇","✚","★","✚","△","○","□","▭","♣","✚","◇","★","△","✚","♣","⬟","✚"],isCorrect:v=>v==="▭"||v==="◇"},
 {page:"05",name:"Encuentra todos los plátanos",type:"emoji",instruction:"Selecciona únicamente todos los plátanos.",data:["🍐","👞","🦋","🍐","🦋","🍐","🔑","🍌","🔑","🍌","👞","🔑","🍌","🔑","🦋","👞","🦋","👞","🍐","🍌"],isCorrect:v=>v==="🍌"}
];

const page06Data = ["b","j",6,"r","z","j","e",7,"q",5,8,"i","k",0,"w",7,"k","s",9,"d",0,"l",8,"ñ",9,"o",1,"s",7,5,"c",7,8,0,"y",0,5,9,"x",3,4,"p",2,"h",6,3,"q","v",1,4,9,"e",3,"f","x",1,4,"p",6,"y",6,"a",2,6,1,"c",9,0,"z",1,"i","n",2,8,"g",7,"j","p",4,2,"f",8,6,0,"m",2,5,3,5,"w",5,"u",4,2,3,"k","r",8,"a",0,"b",2,8,"g","t",8,5,7,"o",8,"b",6,7,4,5,6,3,"s","h",9,"v","r","h","f",8,"q",7,"o","l",3,"l",1,"g",9,4,7,"d",3,4,0,"v",9,1,9,"t",5,"u",2,"n",3,1,3,4,"m","y",6,"a",0,"t","i","z",0,"m","n",5,6,"u",4,"ñ","e",2,7,"ñ",0,"x"];
const page10Rows = [
 ["f","g","u","n","m","h","u","v"],
 ["r","t","x","s","r","j","k","ñ"],
 ["q","g","b","d","p","t","ñ","p"],
 ["x","z","s","r","h","u","x","n"],
 ["s","a","i","e","a","u","d","o"],
 ["z","s","d","c","o","p","h","c"]
];
function duplicateTargets(rows){const set=new Set();rows.forEach((row,ri)=>{const counts={};row.forEach(v=>counts[v]=(counts[v]||0)+1);row.forEach((v,ci)=>{if(counts[v]>1)set.add(`${ri}-${ci}`)})});return set}
const session3Activities = [
 {page:"09",name:"Encuentra las imágenes que se repiten",type:"emoji",instruction:"Selecciona todas las imágenes que aparecen repetidas dentro de la tabla.",data:["🧁","🥬","🛑","🍊","🥐","🫖","⚽","🍐","🕒","🍅","🍲","☕","🔩","🍊","🍞","🍓"],isCorrect:v=>v==="🍊"},
 {page:"10",name:"Encuentra las letras que se repiten",type:"letterRows",instruction:"En cada fila, selecciona las dos letras que se repiten.",rows:page10Rows,targetKeys:duplicateTargets(page10Rows)},
 {page:"06",name:"Encuentra solamente los números",type:"mixed",instruction:"Selecciona únicamente los números; no selecciones letras.",data:page06Data,isCorrect:v=>/^\d$/.test(String(v))}
];

let activities=[],participant={},currentActivity=0,activityStart=null,selections=new Set(),results=[],submitted=false,timerInterval=null;
const $=id=>document.getElementById(id);
function showStatus(message,type="info"){const el=$("status");el.textContent=message;el.className="status "+type;el.style.display="block";setTimeout(()=>el.style.display="none",3500)}
function getActivities(session){return Number(session)===3?session3Activities:session2Activities}
function updateSessionPreview(){const s=Number($("session").value);const acts=getActivities(s);$("subtitle").textContent=`Sesión ${s} · Actividades de atención visual`;$("sessionDescription").innerHTML=`<strong>Sesión ${s}:</strong> páginas ${acts.map(a=>a.page).join(", ")}. El sistema medirá aciertos, errores, omisiones y tiempo.`;renderProgress(acts,-1)}
function renderProgress(acts,active){const p=$("progress");p.innerHTML=`<div class="step ${active===-1?'active':''}">1. Datos</div>`+acts.map((a,i)=>`<div class="step ${active>i?'done':''} ${active===i?'active':''}">${i+2}. Página ${a.page}</div>`).join("")+`<div class="step ${active>=acts.length?'active':''}">${acts.length+2}. Resultado</div>`}
function startSession(){const id=$("participantId").value.trim();if(!id){showStatus("Ingresa el código del participante.","error");return}participant={id,name:$("participantName").value.trim(),age:$("age").value?Number($("age").value):"",session:Number($("session").value)};activities=getActivities(participant.session);currentActivity=0;results=[];submitted=false;$("screenData").classList.add("hidden");$("screenResult").classList.add("hidden");$("screenActivity").classList.remove("hidden");renderActivity()}
function renderActivity(){selections=new Set();const a=activities[currentActivity];let html=`<h2>Página ${a.page}: ${a.name}</h2><div class="instruction"><strong>Instrucción:</strong> ${a.instruction}</div><div class="timer" id="timer">00:00</div><div class="counter" id="counter">Seleccionados: 0</div>`;
 if(a.type==="mixed"){html+=`<div class="item-grid">`+a.data.map((v,i)=>`<button type="button" class="item-btn" data-key="${i}" onclick="selectItem(this)">${v}</button>`).join("")+`</div>`}
 if(a.type==="emoji"){html+=`<div class="emoji-grid">`+a.data.map((v,i)=>`<button type="button" class="emoji-btn" data-key="${i}" onclick="selectItem(this)">${v}</button>`).join("")+`</div>`}
 if(a.type==="letterRows"){html+=`<div class="letter-rows">`+a.rows.map((row,ri)=>`<div class="letter-row">${row.map((v,ci)=>`<button type="button" class="letter-btn" data-key="${ri}-${ci}" onclick="selectItem(this)">${v}</button>`).join("")}</div>`).join("")+`</div>`}
 $("activityContent").innerHTML=html;$("finishActivityBtn").textContent=currentActivity===activities.length-1?"Terminar y ver resultados":"Terminar actividad";activityStart=performance.now();renderProgress(activities,currentActivity);startTimer()}
function startTimer(){clearInterval(timerInterval);timerInterval=setInterval(()=>{if(activityStart&&$("timer"))$("timer").textContent=formatTime(Math.floor((performance.now()-activityStart)/1000))},250)}
function formatTime(sec){return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function selectItem(btn){const key=btn.dataset.key;if(selections.has(key)){selections.delete(key);btn.classList.remove("selected")}else{selections.add(key);btn.classList.add("selected")}$("counter").textContent=`Seleccionados: ${selections.size}`}
function resetCurrentActivity(){renderActivity()}
function finishActivity(){clearInterval(timerInterval);const a=activities[currentActivity],elapsed=Math.max(1,Math.round((performance.now()-activityStart)/1000));let correct=0,incorrect=0,totalTargets=0;
 if(a.type==="letterRows"){totalTargets=a.targetKeys.size;selections.forEach(k=>a.targetKeys.has(k)?correct++:incorrect++)}
 else{totalTargets=a.data.filter(v=>a.isCorrect(v)).length;selections.forEach(k=>a.isCorrect(a.data[Number(k)])?correct++:incorrect++)}
 const missed=Math.max(0,totalTargets-correct),accuracy=(totalTargets+incorrect)>0?Number((correct/(totalTargets+incorrect)*100).toFixed(2)):0;
 results.push({page:a.page,activity:a.name,total_targets:totalTargets,selected_correct:correct,selected_incorrect:incorrect,missed,accuracy_percent:accuracy,time_seconds:elapsed,time_formatted:formatTime(elapsed)});currentActivity++;if(currentActivity<activities.length)renderActivity();else showFinalResult()}
function showFinalResult(){clearInterval(timerInterval);$("screenActivity").classList.add("hidden");$("screenResult").classList.remove("hidden");renderProgress(activities,activities.length);const tc=results.reduce((s,r)=>s+r.selected_correct,0),tw=results.reduce((s,r)=>s+r.selected_incorrect,0),tt=results.reduce((s,r)=>s+r.total_targets,0),tm=results.reduce((s,r)=>s+r.time_seconds,0),overall=tt+tw?(tc/(tt+tw)*100).toFixed(2):"0.00";$("resultContent").innerHTML=`<div class="result-box"><div class="result-score">${overall}%</div><p><strong>Resultado general de la sesión ${participant.session}</strong></p><p>Aciertos: ${tc} · Errores: ${tw} · Tiempo total: ${formatTime(tm)}</p></div><div style="margin-top:18px">${results.map(r=>`<div class="card" style="box-shadow:none;border:1px solid var(--border);margin-bottom:10px"><strong>Página ${r.page} · ${r.activity}</strong><br>Aciertos: ${r.selected_correct} · Errores: ${r.selected_incorrect} · Omisiones: ${r.missed} · Precisión: ${r.accuracy_percent}% · Tiempo: ${r.time_formatted}</div>`).join("")}</div>`}
function submitResults(){if(submitted){showStatus("Los resultados ya fueron enviados.","info");return}submitted=true;const btn=$("submitBtn");btn.disabled=true;btn.textContent="Enviando...";const payload={action:"saveSession",participant,results};$("submitNote").textContent="Enviando resultados...";fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:"data="+encodeURIComponent(JSON.stringify(payload))}).then(()=>{$("submitNote").textContent=`Resultados enviados a la hoja de la sesión ${participant.session}.`;btn.textContent="Resultados enviados";showStatus("Resultados enviados correctamente.","success")}).catch(err=>{console.error(err);submitted=false;btn.disabled=false;btn.textContent="Enviar resultados";$("submitNote").textContent="No se pudieron enviar los resultados.";showStatus("Error al enviar.","error")})}
updateSessionPreview();
</script>
</body>
</html>
