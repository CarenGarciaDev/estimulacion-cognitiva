<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimulación Cognitiva para Adultos</title>
<style>
:root{--p:#5b8f7b;--pd:#3f6b5c;--bg:#f5faf8;--card:#fff;--text:#1f2937;--muted:#64748b;--ok:#15803d;--bad:#b91c1c;--border:#dbe7e2;--accent:#e8f3ef}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:18px}
header{background:linear-gradient(135deg,var(--pd),var(--p));color:white;padding:26px 18px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(26px,4vw,42px)}
header p{margin:0;opacity:.95}
main{max-width:1050px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 6px 24px rgba(31,41,55,.06)}
.hidden{display:none!important}
.grid{display:grid;gap:14px}
.grid2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{font-weight:700;display:block;margin:8px 0}
input,select{width:100%;padding:13px;border:2px solid var(--border);border-radius:12px;font-size:18px;background:white}
button{border:0;border-radius:12px;padding:13px 18px;font-size:18px;font-weight:700;cursor:pointer;background:var(--p);color:white}
button:hover{filter:brightness(.96)}
button.secondary{background:#64748b}
button.option{background:white;color:var(--text);border:2px solid var(--border);min-height:54px}
button.option.selected{border-color:var(--p);background:var(--accent)}
button.option.correct{border-color:var(--ok);background:#ecfdf3}
button.option.wrong{border-color:var(--bad);background:#fff1f2}
.session-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.session-buttons button{padding:16px 8px}
.badge{display:inline-block;background:var(--accent);color:var(--pd);padding:6px 10px;border-radius:999px;font-weight:700}
.activity-title{font-size:26px;margin:0 0 8px}
.instruction{font-size:20px;line-height:1.45;margin-bottom:18px}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0 22px}
.progress>div{height:100%;background:var(--p);width:0}
.rows{display:grid;gap:16px}
.rowbox{border:2px solid var(--border);border-radius:14px;padding:14px}
.option-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.big{font-size:32px}
.symbol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px}
.symbol{padding:14px;border:2px solid var(--border);border-radius:12px;text-align:center;font-size:28px;background:white;cursor:pointer}
.symbol.selected{background:var(--accent);border-color:var(--p)}
.sequence-item{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;margin:10px 0}
.sequence-item select{width:90px}
.sentence{display:grid;gap:8px;margin:14px 0}
.wordbank{display:flex;flex-wrap:wrap;gap:8px}
.word{background:#f8fafc;border:2px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer}
.answerline{min-height:50px;border:2px dashed #cbd5e1;border-radius:10px;padding:10px;background:#fff}
.definition{padding:14px;border:1px solid var(--border);border-radius:12px;margin:10px 0}
.size-row{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:12px;margin:10px 0}
.targetbox{text-align:center;border:3px solid #e11d48;border-radius:10px;padding:8px}
.choices{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.size-choice{min-width:95px;min-height:95px;display:flex;justify-content:center;align-items:center;background:white;border:2px solid var(--border);border-radius:10px;cursor:pointer}
.shadow{font-size:54px;filter:grayscale(1) brightness(0)}
.summary{font-size:20px;line-height:1.6}
.kpi{background:#f8fafc;border-radius:12px;padding:14px;text-align:center}
.kpi strong{display:block;font-size:28px}
footer{text-align:center;color:var(--muted);padding:28px}
@media(max-width:600px){body{font-size:17px}.size-row{grid-template-columns:1fr}.targetbox{max-width:160px}.activity-title{font-size:23px}}
</style>
</head>
<body>
<header>
  <h1>Estimulación Cognitiva para Adultos</h1>
  <p>Actividades interactivas por sesión</p>
</header>
<main>
<section id="welcome" class="card">
  <h2>Datos del participante</h2>
  <div class="grid grid2">
    <div><label for="pid">Código del participante</label><input id="pid" placeholder="Ej. P001"></div>
    <div><label for="pname">Nombre o alias</label><input id="pname" placeholder="Nombre"></div>
    <div><label for="age">Edad</label><input id="age" type="number" min="18" max="120"></div>
  </div>
  <h2>Selecciona la sesión</h2>
  <div class="session-buttons" id="sessionButtons"></div>
  <p style="color:var(--muted)">Los resultados de cada sesión se guardan en una hoja independiente del mismo Google Sheet.</p>
</section>

<section id="runner" class="hidden">
  <div class="card">
    <span class="badge" id="sessionBadge"></span>
    <div class="progress"><div id="progressBar"></div></div>
    <div id="activityHost"></div>
    <div style="display:flex;gap:10px;justify-content:space-between;margin-top:20px">
      <button class="secondary" id="exitBtn">Salir</button>
      <button id="nextBtn">Continuar</button>
    </div>
  </div>
</section>

<section id="finish" class="card hidden">
  <h2>Sesión completada</h2>
  <div id="summary" class="summary"></div>
  <button id="sendBtn">Enviar resultados</button>
  <button class="secondary" id="homeBtn">Volver al inicio</button>
  <p id="sendStatus"></p>
</section>
</main>
<footer>Herramienta educativa de estimulación cognitiva</footer>

let currentSession=null, activityIndex=0, activityResults=[], startedAt=0, state={};

function fmt(sec){sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[¿?¡!.,;:]/g,"").replace(/\s+/g," ").trim()}
function participant(){
 return {participant_id:document.getElementById("pid").value.trim(),participant_name:document.getElementById("pname").value.trim(),age:document.getElementById("age").value.trim()}
}
function validateParticipant(){const p=participant();if(!p.participant_id||!p.participant_name||!p.age){alert("Completa código, nombre y edad.");return false}return true}

Object.keys(sessions).forEach(s=>{const b=document.createElement("button");b.textContent="Sesión "+s;b.onclick=()=>startSession(Number(s));sb.appendChild(b)});

function startSession(s){
 if(!validateParticipant()) return;
 currentSession=s; activityIndex=0; activityResults=[]; startedAt=Date.now();
 document.getElementById("welcome").classList.add("hidden");document.getElementById("finish").classList.add("hidden");document.getElementById("runner").classList.remove("hidden");
 document.getElementById("sessionBadge").textContent="Sesión "+s;
 renderActivity();
}
function renderActivity(){
 const a=sessions[currentSession][activityIndex]; state={};
 document.getElementById("progressBar").style.width=((activityIndex)/sessions[currentSession].length*100)+"%";
 const h=document.getElementById("activityHost");
 h.innerHTML=`<h2 class="activity-title">Página ${a.page} · ${a.title}</h2><p class="instruction">${a.instruction||defaultInstruction(a)}</p><div id="activityBody"></div>`;
 const body=document.getElementById("activityBody");
 ({repeatRows,repeatCols,selectTargets,duplicates,repeatLetters,numbersOnly,sequence,singleChoice,oddGroups,sentences,definitions,sizeMatch,shadowMatch,count}[a.type])(a,body);
 document.getElementById("nextBtn").textContent=activityIndex===sessions[currentSession].length-1?"Finalizar sesión":"Continuar";
}
function defaultInstruction(a){
 const m={repeatRows:"Selecciona en cada fila las dos imágenes que se repiten.",repeatCols:"Selecciona en cada columna las dos imágenes que se repiten.",repeatLetters:"Selecciona la letra que se repite en cada fila.",sizeMatch:"Selecciona la opción que tenga el mismo tamaño que el modelo.",shadowMatch:"Selecciona la sombra que corresponde al objeto.",definitions:"Lee cada definición y elige la respuesta correcta.",sentences:"Pulsa las palabras en el orden correcto para formar cada frase.",count:"Cuenta los elementos y escribe el total."};
 return m[a.type]||"Completa la actividad.";
}
function selectable(el,key,val){el.onclick=()=>{if(!state[key])state[key]=new Set(); if(state[key].has(val)){state[key].delete(val);el.classList.remove("selected")}else{state[key].add(val);el.classList.add("selected")}}}
function repeatRows(a,b){state.rows=[];a.rows.forEach((r,i)=>{const box=document.createElement("div");box.className="rowbox";box.innerHTML=`<strong>Fila ${i+1}</strong>`;const row=document.createElement("div");row.className="option-row";r.forEach((x,j)=>{const e=document.createElement("button");e.className="option big";e.textContent=x;selectable(e,"r"+i,j);row.appendChild(e)});box.appendChild(row);b.appendChild(box)})}
function repeatCols(a,b){repeatRows({rows:a.cols},b)}
function selectTargets(a,b){const g=document.createElement("div");g.className="symbol-grid";a.items.forEach((x,i)=>{const e=document.createElement("div");e.className="symbol";e.textContent=x;selectable(e,"sel",i);g.appendChild(e)});b.appendChild(g)}
function duplicates(a,b){selectTargets(a,b)}
function numbersOnly(a,b){selectTargets(a,b)}
function repeatLetters(a,b){repeatRows({rows:a.rows},b)}
function sequence(a,b){state.seq=[];a.items.forEach((x,i)=>{const d=document.createElement("div");d.className="sequence-item";const s=document.createElement("select");s.innerHTML='<option value="">—</option>'+a.items.map((_,k)=>`<option>${k+1}</option>`).join("");s.onchange=()=>state.seq[i]=Number(s.value);d.appendChild(s);const t=document.createElement("div");t.textContent=x;d.appendChild(t);b.appendChild(d)})}
function singleChoice(a,b){const row=document.createElement("div");row.className="option-row";a.options.forEach(x=>{const e=document.createElement("button");e.className="option";e.textContent=x;e.onclick=()=>{state.choice=x;[...row.children].forEach(z=>z.classList.remove("selected"));e.classList.add("selected")};row.appendChild(e)});b.appendChild(row)}
function oddGroups(a,b){state.groups=[];a.groups.forEach((g,i)=>{const d=document.createElement("div");d.className="rowbox";d.innerHTML=`<strong>Grupo ${i+1}</strong>`;const row=document.createElement("div");row.className="option-row";g.words.forEach(w=>{const e=document.createElement("button");e.className="option";e.textContent=w;e.onclick=()=>{state.groups[i]=w;[...row.children].forEach(z=>z.classList.remove("selected"));e.classList.add("selected")};row.appendChild(e)});d.appendChild(row);b.appendChild(d)})}
function sentences(a,b){state.sent=a.sets.map(()=>[]);a.sets.forEach((s,i)=>{const d=document.createElement("div");d.className="sentence";d.innerHTML=`<strong>Frase ${i+1}</strong>`;const bank=document.createElement("div");bank.className="wordbank";const line=document.createElement("div");line.className="answerline";s.words.forEach((w,j)=>{const e=document.createElement("span");e.className="word";e.textContent=w;e.onclick=()=>{if(e.dataset.used)return;e.dataset.used="1";e.style.opacity=".35";state.sent[i].push(w);line.textContent=state.sent[i].join(" ")};bank.appendChild(e)});line.onclick=()=>{state.sent[i]=[];line.textContent="";[...bank.children].forEach(e=>{e.dataset.used="";e.style.opacity="1"})};d.appendChild(bank);d.appendChild(line);b.appendChild(d)})}
function definitions(a,b){state.q=[];a.questions.forEach((q,i)=>{const d=document.createElement("div");d.className="definition";d.innerHTML=`<strong>${i+1}. ${q[0]}</strong>`;const row=document.createElement("div");row.className="option-row";q[2].forEach(x=>{const e=document.createElement("button");e.className="option";e.textContent=x;e.onclick=()=>{state.q[i]=x;[...row.children].forEach(z=>z.classList.remove("selected"));e.classList.add("selected")};row.appendChild(e)});d.appendChild(row);b.appendChild(d)})}
function sizeMatch(a,b){state.size=[];a.rows.forEach((r,i)=>{const d=document.createElement("div");d.className="size-row";const target=document.createElement("div");target.className="targetbox";target.innerHTML=`<div style="font-size:54px">${r[0]}</div><small>Modelo</small>`;const ch=document.createElement("div");ch.className="choices";r[1].forEach((sz,j)=>{const e=document.createElement("div");e.className="size-choice";e.innerHTML=`<span style="font-size:${sz}px">${r[0]}</span>`;e.onclick=()=>{state.size[i]=j;[...ch.children].forEach(z=>z.classList.remove("selected"));e.classList.add("selected")};ch.appendChild(e)});d.append(target,ch);b.appendChild(d)})}
function shadowMatch(a,b){state.shadow=[];a.rows.forEach((r,i)=>{const d=document.createElement("div");d.className="size-row";const target=document.createElement("div");target.className="targetbox";target.innerHTML=`<div style="font-size:54px">${r[0]}</div><small>Objeto</small>`;const ch=document.createElement("div");ch.className="choices";r[1].forEach((x,j)=>{const e=document.createElement("div");e.className="size-choice";e.innerHTML=`<span class="shadow">${x}</span>`;e.onclick=()=>{state.shadow[i]=j;[...ch.children].forEach(z=>z.classList.remove("selected"));e.classList.add("selected")};ch.appendChild(e)});d.append(target,ch);b.appendChild(d)})}
function count(a,b){state.count="";const g=document.createElement("div");g.style.fontSize="42px";g.style.lineHeight="1.7";g.style.textAlign="center";g.textContent=Array(a.count).fill(a.emoji).join(" ");const inp=document.createElement("input");inp.type="number";inp.placeholder="Escribe el total";inp.style.marginTop="18px";inp.oninput=()=>state.count=inp.value;b.append(g,inp)}

function scoreActivity(a){
 let correct=0,total=0,detail="";
 if(a.type==="repeatRows"||a.type==="repeatCols"){total=a.answers.length; a.answers.forEach((ans,i)=>{const s=state["r"+i]||new Set();if(ans.length===s.size&&ans.every(x=>s.has(x)))correct++})}
 else if(a.type==="repeatLetters"){total=a.answers.length;a.answers.forEach((ans,i)=>{const s=state["r"+i]||new Set();if(ans.length===0? s.size===0 : ans.some(letter=>[...s].some(idx=>a.rows[i][idx]===letter)))correct++})}
 else if(["selectTargets","duplicates"].includes(a.type)){const s=state.sel||new Set();const targetIdx=a.items.map((x,i)=>a.targets.includes(x)?i:-1).filter(i=>i>=0);total=targetIdx.length;correct=targetIdx.filter(i=>s.has(i)).length;const wrong=[...s].filter(i=>!targetIdx.includes(i)).length;correct=Math.max(0,correct-wrong)}
 else if(a.type==="numbersOnly"){const s=state.sel||new Set();const targetIdx=a.items.map((x,i)=>/^\d$/.test(x)?i:-1).filter(i=>i>=0);total=targetIdx.length;correct=targetIdx.filter(i=>s.has(i)).length;correct=Math.max(0,correct-[...s].filter(i=>!targetIdx.includes(i)).length)}
 else if(a.type==="sequence"){total=a.correct.length;correct=a.correct.filter((x,i)=>state.seq&&state.seq[i]===x).length}
 else if(a.type==="singleChoice"){total=1;correct=state.choice===a.correct?1:0}
 else if(a.type==="oddGroups"){total=a.groups.length;correct=a.groups.filter((g,i)=>state.groups&&state.groups[i]===g.correct).length}
 else if(a.type==="sentences"){total=a.sets.length;correct=a.sets.filter((s,i)=>norm((state.sent[i]||[]).join(" "))===norm(s.correct)).length}
 else if(a.type==="definitions"){total=a.questions.length;correct=a.questions.filter((q,i)=>state.q&&state.q[i]===q[1]).length}
 else if(a.type==="sizeMatch"){total=a.rows.length;correct=a.rows.filter((r,i)=>state.size&&state.size[i]===r[2]).length}
 else if(a.type==="shadowMatch"){total=a.rows.length;correct=a.rows.filter((r,i)=>state.shadow&&state.shadow[i]===r[2]).length}
 else if(a.type==="count"){total=1;correct=Number(state.count)===a.count?1:0}
 return {correct,total,incorrect:total-correct,percent:total?Math.round(correct/total*10000)/100:0,detail};
}
document.getElementById("nextBtn").onclick=()=>{
 const a=sessions[currentSession][activityIndex],r=scoreActivity(a);
 activityResults.push({page:a.page,title:a.title,...r});
 if(activityIndex<sessions[currentSession].length-1){activityIndex++;renderActivity()}else finishSession()
};
function finishSession(){
 document.getElementById("runner").classList.add("hidden");document.getElementById("finish").classList.remove("hidden");
 const sec=(Date.now()-startedAt)/1000, tc=activityResults.reduce((s,r)=>s+r.correct,0), tt=activityResults.reduce((s,r)=>s+r.total,0), pct=tt?Math.round(tc/tt*10000)/100:0;
 document.getElementById("summary").innerHTML=`<div class="grid grid3"><div class="kpi"><span>Aciertos</span><strong>${tc}/${tt}</strong></div><div class="kpi"><span>Resultado</span><strong>${pct}%</strong></div><div class="kpi"><span>Tiempo</span><strong>${fmt(sec)}</strong></div></div>`+
 activityResults.map(r=>`<p><b>Página ${r.page}:</b> ${r.correct}/${r.total} (${r.percent}%)</p>`).join("");
 state.final={time_seconds:Math.round(sec),time_formatted:fmt(sec),total_correct:tc,total_items:tt,total_incorrect:tt-tc,overall_accuracy_percent:pct};
}
document.getElementById("sendBtn").onclick=async()=>{
 const btn=document.getElementById("sendBtn");btn.disabled=true;btn.textContent="Enviando...";
 const p=participant();
 const payload={...p,session:currentSession,...state.final,activities:activityResults,timestamp:new Date().toISOString()};
 const fd=new URLSearchParams();fd.set("data",JSON.stringify(payload));
 try{
   await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:fd.toString()});
   document.getElementById("sendStatus").textContent="✅ Resultados enviados. Revisa la hoja Sesion_"+currentSession+".";
   btn.textContent="Enviado";
 }catch(e){document.getElementById("sendStatus").textContent="❌ No fue posible enviar. Verifica tu conexión.";btn.disabled=false;btn.textContent="Enviar resultados"}
};
document.getElementById("homeBtn").onclick=()=>location.reload();
document.getElementById("exitBtn").onclick=()=>{if(confirm("¿Salir de la sesión?"))location.reload()};
</script>
